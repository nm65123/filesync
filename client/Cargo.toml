[package]
name = "filesync-client"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22"
blake3 = "1.8.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = "3.5.2"
ctrlc = { version = "3.5.2", features = ["termination"] }

[target."cfg(unix)".dependencies]
fuser = "0.18.0"
libc = "0.2.191"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_CloudFilters", "Win32_Storage_FileSystem", "Win32_System_CorrelationVector", "Win32_System_IO", "Win32_System_Threading"] }
windows = { version = "0.62.2", features = ["Foundation", "Storage", "Storage_Provider", "Storage_Search", "Storage_Streams", "Win32_System_WinRT"] }
